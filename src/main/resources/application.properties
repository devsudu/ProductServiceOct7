spring.application.name=ProductServiceOct7

logging.level.org.springframework.web.*=TRACE

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://mysql:3306/productserviceoct7
spring.datasource.username=productserviceoct7user
#spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=productservice
eureka.instance.prefer-ip-address=true

server.port=9000

user.service.baseUrl=http://localhost:8000/users

management.endpoints.web.exposure.include: health

endpoint.health.show-details: always